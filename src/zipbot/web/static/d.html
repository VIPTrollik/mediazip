<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Download attachments</title>
<link rel="stylesheet" href="/static/style.css">
<script type="module" src="/static/d.js"></script>
</head>
<body>
<main>
  <header>
    <h1>Download attachments</h1>
    <p id="summary" class="muted">Loading…</p>
  </header>

  <section id="actions" hidden>
    <div class="buttons">
      <button id="btn-files" type="button">📱 Save to phone</button>
      <button id="btn-zip" type="button">⬇ Download ZIP</button>
      <button id="btn-share" type="button" hidden>↗ Share</button>
    </div>
    <p id="hint" class="muted" hidden></p>
    <div id="progress" hidden>
      <progress id="bar" max="1" value="0"></progress>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section id="error" class="error" role="alert" hidden>
    <h2 id="error-title"></h2>
    <p id="error-text"></p>
  </section>

  <ul id="grid" class="grid"></ul>

  <footer class="muted">
    Files are downloaded by your browser straight from Discord; nothing is stored on this server.
    <a href="/privacy">Privacy</a>
  </footer>
</main>
</body>
</html>
