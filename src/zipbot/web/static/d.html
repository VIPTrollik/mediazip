<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Download · MediaZip</title>
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1f22" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/static/style.css">
<script type="module" src="/static/d.js"></script>
</head>
<body data-state="loading">
<main>
  <header class="page-header">
    <h1>Download files</h1>
    <p id="summary" class="muted">Loading files…</p>
  </header>

  <div id="error" class="alert alert--danger" role="alert" tabindex="-1" hidden>
    <svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-alert"/></svg>
    <p id="error-title" class="alert__title"></p>
    <p id="error-text" class="alert__body"></p>
    <div id="error-actions" class="alert__actions" hidden></div>
  </div>

  <section id="actions" class="stack-sm" aria-label="Download options" hidden>
    <div class="actions">
      <button id="btn-files" class="btn btn--primary btn--lg" type="button"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-download"/></svg><span class="btn__label">Download all</span></button>
      <button id="btn-zip" class="btn btn--secondary btn--lg" type="button"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-archive"/></svg><span class="btn__label">Download ZIP</span></button>
      <button id="btn-share" class="btn btn--ghost btn--lg" type="button" hidden><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-share"/></svg><span class="btn__label">Share</span></button>
    </div>
    <p id="picker-note" class="muted small" hidden>Download all asks for a folder once. Chrome can't save into
      Downloads itself, so pick or create a folder inside it, for example Downloads/Discord.</p>
    <p id="hint" class="muted small" hidden></p>
    <p id="tip" class="muted small" hidden></p>
  </section>

  <div id="progress" class="progress" hidden>
    <div class="progress__label"><b id="progress-label"></b><span id="progress-count"></span></div>
    <progress id="bar" max="1" value="0" aria-labelledby="progress-label"></progress>
  </div>

  <div id="status" class="alert" role="status" hidden>
    <svg class="icon" aria-hidden="true"><use id="status-icon" href="/static/icons.svg#i-check"/></svg>
    <p id="status-title" class="alert__title"></p>
    <p id="status-text" class="alert__body"></p>
    <div id="status-actions" class="alert__actions actions" hidden></div>
  </div>

  <ul id="grid" class="grid" aria-label="Files">
    <li class="tile tile--skeleton" aria-hidden="true"><div class="tile__media skeleton"></div><div class="tile__body"><span class="skeleton skeleton--line"></span><span class="skeleton skeleton--line skeleton--short"></span></div></li>
    <li class="tile tile--skeleton" aria-hidden="true"><div class="tile__media skeleton"></div><div class="tile__body"><span class="skeleton skeleton--line"></span><span class="skeleton skeleton--line skeleton--short"></span></div></li>
    <li class="tile tile--skeleton" aria-hidden="true"><div class="tile__media skeleton"></div><div class="tile__body"><span class="skeleton skeleton--line"></span><span class="skeleton skeleton--line skeleton--short"></span></div></li>
    <li class="tile tile--skeleton" aria-hidden="true"><div class="tile__media skeleton"></div><div class="tile__body"><span class="skeleton skeleton--line"></span><span class="skeleton skeleton--line skeleton--short"></span></div></li>
  </ul>
</main>

<footer class="site-footer note">
  <svg class="icon icon--sm" aria-hidden="true"><use href="/static/icons.svg#i-lock"/></svg>
  <p>Files are downloaded by your browser straight from Discord; nothing is stored on this server.
    <a href="/privacy">Privacy</a></p>
</footer>
</body>
</html>
