<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Download attachments</title>
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1f22" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/static/style.css">
<script type="module" src="/static/d.js"></script>
</head>
<body>
<main>
  <header class="page-header">
    <h1>Download attachments</h1>
    <p id="summary" class="muted">Loading…</p>
  </header>

  <section id="actions" hidden>
    <div class="actions buttons">
      <button id="btn-files" class="btn btn--secondary" type="button"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-download"/></svg> Save to phone</button>
      <button id="btn-zip" class="btn btn--secondary" type="button"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-archive"/></svg> Download ZIP</button>
      <button id="btn-share" class="btn btn--secondary" type="button" hidden><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#i-share"/></svg> Share</button>
    </div>
    <p id="hint" class="muted" hidden></p>
    <div id="progress" class="progress" hidden>
      <progress id="bar" max="1" value="0"></progress>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </section>

  <section id="error" class="error" role="alert" hidden>
    <h2 id="error-title"></h2>
    <p id="error-text"></p>
  </section>

  <ul id="grid" class="grid"></ul>

  <footer class="site-footer note">
    <svg class="icon icon--sm" aria-hidden="true"><use href="/static/icons.svg#i-lock"/></svg>
    <p>Files are downloaded by your browser straight from Discord; nothing is stored on this server.
      <a href="/privacy">Privacy</a></p>
  </footer>
</main>
</body>
</html>
