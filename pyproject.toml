[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zipbot"
version = "0.0.0"
description = "MediaZip: a Discord app to download all images/videos of a message, ZIP built in the browser"
requires-python = ">=3.12"
dependencies = [
    "discord.py==2.7.1",
    "aiohttp==3.14.5",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
]

[project.urls]
Homepage = "https://mediazip.download"
Source = "https://github.com/VIPTrollik/mediazip"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-aiohttp==1.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "pyright[nodejs]==1.1.414",
    "pip-audit==2.10.1",
    "playwright==1.64.0",
    "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zipbot = ["web/static/*", "web/static/brand/*", "web/static/media/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/spike"]  # Phase 0 throwaway tooling

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310", "S603", "S607"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["tests/spike"]
extraPaths = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/spike", "tests/fixtures"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.coverage.run]
source = ["zipbot"]
branch = true

[tool.ruff.lint.isort]
known-first-party = ["zipbot", "helpers"]
