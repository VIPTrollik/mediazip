services:
  zipbot:
    build: .
    image: zipbot:local
    env_file: .env
    environment:
      # Only the network gateway (what the host's nginx connects from) may set X-Forwarded-For.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,${ZIPBOT_GATEWAY:-172.30.88.1}}
      # Daily usage counters only (no ids, IPs or names); see README "Usage statistics".
      STATS_PATH: /data/stats.json
    networks:
      - zipbot
    restart: unless-stopped
    ports:
      # Only nginx on the host reaches it. HOST_PORT (default 8080) picks the host side, e.g.
      # 8090 where 8080 is taken; the container always listens on 8080.
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - zipbot-data:/data  # the only writable path besides /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  zipbot-data:

# A fixed subnet, so TRUSTED_PROXIES can name its gateway. Set ZIPBOT_SUBNET and
# ZIPBOT_GATEWAY (in .env or the shell) if 172.30.88.0/24 clashes with another network;
# TRUSTED_PROXIES follows ZIPBOT_GATEWAY unless set itself.
networks:
  zipbot:
    ipam:
      config:
        - subnet: ${ZIPBOT_SUBNET:-172.30.88.0/24}
          gateway: ${ZIPBOT_GATEWAY:-172.30.88.1}
